# Firstmate Kestra seam, M1 shape flow. Synthetic data only.
#
# Git review is the only way this file changes, and bin/fm-kestra-deploy.sh is the
# only authorized path from this file into a Kestra namespace. The
# `system.readOnly` label below is what stops the Kestra UI editor from changing
# the deployed copy out from under Git.
#
# The flow exercises the shapes the seam has to be able to observe: typed and
# constrained inputs, a sequential group, a parallel group, a branch, a written
# artifact, and a declared flow output.
id: m1_shape
namespace: firstmate.m1

labels:
  system.readOnly: "true"

inputs:
  - id: units
    type: INT
    required: true
    min: 1
    max: 5
  - id: route
    type: SELECT
    required: true
    values:
      - safe
      - fast
  - id: label
    type: STRING
    required: true
    validator: ^synthetic-[a-z]+$

tasks:
  - id: begin
    type: io.kestra.plugin.core.log.Log
    message: "begin {{ inputs.label }} units={{ inputs.units }}"
  - id: sequential
    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: seq_first
        type: io.kestra.plugin.core.log.Log
        message: "sequential first"
      - id: seq_second
        type: io.kestra.plugin.core.debug.Return
        format: "sequential second for {{ inputs.units }} units"
  - id: parallel
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: par_left
        type: io.kestra.plugin.core.log.Log
        message: "parallel left"
      - id: par_right
        type: io.kestra.plugin.core.log.Log
        message: "parallel right"
  - id: choose_route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.route == 'safe' }}"
    then:
      - id: safe_branch
        type: io.kestra.plugin.core.debug.Return
        format: "safe branch selected"
    else:
      - id: fast_branch
        type: io.kestra.plugin.core.debug.Return
        format: "fast branch selected"
  - id: artifact
    type: io.kestra.plugin.core.storage.Write
    extension: .txt
    content: |
      label={{ inputs.label }}
      units={{ inputs.units }}
      route={{ inputs.route }}
  - id: finish
    type: io.kestra.plugin.core.debug.Return
    format: "finished {{ inputs.label }} via {{ inputs.route }}"

outputs:
  - id: summary
    type: STRING
    value: "{{ outputs.finish.value }}"
  - id: artifact
    type: FILE
    value: "{{ outputs.artifact.uri }}"
