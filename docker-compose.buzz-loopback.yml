# docker-compose.buzz-loopback.yml - loopback-only Buzz relay for the M1 proof of concept.
#
# Disposable proof-of-concept infrastructure for bin/fm-buzz-publish.sh.
# Warning: the relay is open to local processes, and its datastores retain fleet
# projections across reboots until the volumes are removed with `down -v`.
# See docs/buzz-loopback-adapter.md for the full threat model, invariants, and
# reboot-persistence contract.
#
# Reference: upstream deploy/compose/compose.yml at github.com/block/buzz
# commit 7fb008f9 (Apache-2.0), reduced to four runtime services plus two
# one-shot initialization jobs and re-pointed at loopback.
#
# Usage:
#   colima start                                                        # if needed
#   docker compose -f docker-compose.buzz-loopback.yml up -d
#   bin/fm-buzz-publish.sh --refresh
#   docker compose -f docker-compose.buzz-loopback.yml down -v          # clean slate

name: buzz-loopback

services:
  relay-key-init:
    image: node:24-alpine
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        node -e '
          const { randomBytes } = require("node:crypto");
          const { chmodSync, chownSync, existsSync, writeFileSync } = require("node:fs");
          const file = "/relay-key/private-key";
          const order = 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141n;
          if (!existsSync(file)) {
            let bytes;
            let scalar;
            do {
              bytes = randomBytes(32);
              scalar = BigInt(`0x${bytes.toString("hex")}`);
            } while (scalar === 0n || scalar >= order);
            writeFileSync(file, `${bytes.toString("hex")}\n`, { flag: "wx", mode: 0o400 });
          }
          chownSync(file, 1000, 1000);
          chmodSync(file, 0o400);
        '
    volumes:
      - buzz-relay-key:/relay-key
    restart: "no"

  relay:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    entrypoint:
      - /bin/bash
      - -euc
      - |
        export BUZZ_RELAY_PRIVATE_KEY="$$(cat /run/buzz-relay-key/private-key)"
        exec /usr/local/bin/buzz-relay
    environment:
      # Container-internal bind; only the host-facing `ports:` mapping controls exposure.
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:buzz_loopback_poc@postgres:5432/buzz
      REDIS_URL: redis://redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not arbitrary `<bucket>.minio` hosts.
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: buzz_loopback_poc
      BUZZ_S3_SECRET_KEY: buzz_loopback_poc_secret
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      # Disposable stack: migrate on boot so `up -d` is the whole setup step and
      # `down -v` is the whole teardown step.
      BUZZ_AUTO_MIGRATE: "true"
      # Open to local processes by PoC design; see docs/buzz-loopback-adapter.md.
      BUZZ_REQUIRE_AUTH_TOKEN: "false"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "false"
      BUZZ_GIT_CONFORMANCE_PROBE: "false"
      RUST_LOG: buzz_relay=info,buzz_db=warn,buzz_auth=info,tower_http=warn
    ports:
      # Loopback-only. Never change the left-hand side to 0.0.0.0 or a LAN address:
      # that would breach the loopback invariant this whole PoC rests on.
      - "127.0.0.1:${BUZZ_LOOPBACK_PORT:-3000}:3000"
    volumes:
      - buzz-git-data:/data/git
      - buzz-relay-key:/run/buzz-relay-key:ro
    depends_on:
      relay-key-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp: the runtime image has bash but no curl/wget.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    # Do not auto-restart the host-facing relay; datastores retain projections.
    restart: "no"
    networks:
      - buzz-loopback-net

  # No `ports:` on this service or the two below - deliberately unreachable from
  # the host, stricter than the loopback requirement.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_loopback_poc
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzz-loopback-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - buzz-loopback-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buzz_loopback_poc
      MINIO_ROOT_PASSWORD: buzz_loopback_poc_secret
    volumes:
      - buzz-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzz-loopback-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 buzz_loopback_poc buzz_loopback_poc_secret
        mc mb --ignore-existing local/buzz-media
        mc anonymous set none local/buzz-media
      '
    restart: "no"
    networks:
      - buzz-loopback-net

volumes:
  buzz-postgres-data:
  buzz-redis-data:
  buzz-minio-data:
  buzz-git-data:
  buzz-relay-key:

networks:
  buzz-loopback-net:
    driver: bridge
