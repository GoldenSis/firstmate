# docker-compose.buzz-loopback.yml - loopback-only Buzz relay for the M1 proof of concept.
#
# WHAT THIS IS
# Disposable proof-of-concept infrastructure for the read-only bearings publisher
# (bin/fm-buzz-publish.sh). It is checked in so the stack is reproducible; the
# RUNNING instance is throwaway. `docker compose -f docker-compose.buzz-loopback.yml
# down -v` returns the machine to a clean state, volumes included.
#
# WHY IT IS LOOPBACK-ONLY (decision D2)
# The captain answered the relay-hosting decision as self-hosted loopback, not
# hosted buzz.xyz, so captain-private fleet state (task ids, project names,
# blockers, PR URLs) never leaves this machine. The scout study also found Buzz
# ships NO application-layer rate limiting: RateLimitConfig defines four tiers but
# the only RateLimiter implementation is a test stub, so an internet-exposed relay
# has no brute-force or flood protection. Loopback-only is what makes that gap
# irrelevant. See docs/buzz-loopback-adapter.md for the full invariant list.
#
# WHAT LOOPBACK DOES AND DOES NOT BUY, STATED PLAINLY
# Loopback keeps the relay off the network. It does NOT make it single-user. Every
# local process running as any user on this host can open 127.0.0.1:3000 and speak
# to the relay, and the settings below accept them: this is an open relay, with no
# auth token and no membership enforcement. The channel is no barrier either -
# channelIdForLabel (bin/fm-buzz-lib.mjs) is a plain SHA-256 of the FM_HOME path,
# derived rather than random and therefore not a secret. A local process that
# creates the group first becomes its owner and can read the bearings projections
# published into it, which are captain-private fleet state (task ids, project
# names, blockers, PR URLs).
#
# That local-process exposure is an ACCEPTED RISK for this proof of concept, on a
# single-user laptop, with a disposable stack. It is recorded here rather than
# argued away, because the real boundary being relied on is "no other local user",
# not "no remote party". Enforcing membership so the boundary matches the claim
# belongs to Milestone 2, which already owns channel membership management.
#
# The relay does not restart itself, so a reboot ends the exposure. The datastores
# do, and they self-resume across a host reboot still holding every published
# bearings projection; only `docker compose -f docker-compose.buzz-loopback.yml
# down -v` ends the exposure for good, volumes included.
#
# THE ONE PUBLISHED PORT, AND WHY IT READS AS IT DOES
# Only the relay is published, and only to 127.0.0.1. Postgres, Redis and MinIO are
# deliberately NOT published at all - they are reachable only over the internal
# compose network, which is stricter than loopback. BUZZ_BIND_ADDR is 0.0.0.0:3000
# INSIDE the container because Docker's port proxy connects to the container's own
# address; binding 127.0.0.1 inside the container would make the published port
# unreachable. The host-facing exposure is the `ports:` mapping, and that mapping is
# loopback-only. There is no 0.0.0.0 host publish anywhere in this file.
#
# CREDENTIALS
# The literals below are non-secret, PoC-only values, deliberately inline so the
# stack starts with no .env step. They are safe here precisely because nothing that
# consumes them is reachable off this host: the datastores publish no port, and the
# relay publishes only to 127.0.0.1. Do not reuse this file, or these values, for
# any exposed deployment - upstream's deploy/compose/compose.yml is the reference
# for that, and it requires real secrets.
#
# Reference: upstream deploy/compose/compose.yml at github.com/block/buzz
# commit 7fb008f9 (Apache-2.0), reduced to the four services M1 needs and
# re-pointed at loopback.
#
# Usage:
#   colima start                                                        # if needed
#   docker compose -f docker-compose.buzz-loopback.yml up -d
#   bin/fm-buzz-publish.sh --refresh
#   docker compose -f docker-compose.buzz-loopback.yml down -v          # clean slate

name: buzz-loopback

services:
  relay:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    environment:
      # Container-internal bind. See "THE ONE PUBLISHED PORT" above: this is not a
      # host exposure, the `ports:` mapping below is, and it is loopback-only.
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:buzz_loopback_poc@postgres:5432/buzz
      REDIS_URL: redis://redis:6379
      BUZZ_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not arbitrary `<bucket>.minio` hosts.
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: buzz_loopback_poc
      BUZZ_S3_SECRET_KEY: buzz_loopback_poc_secret
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      # Disposable stack: migrate on boot so `up -d` is the whole setup step and
      # `down -v` is the whole teardown step.
      BUZZ_AUTO_MIGRATE: "true"
      # Open relay: the single local Firstmate key publishes with no membership
      # provisioning step. What this rests on is that no REMOTE party can reach the
      # socket - it does not keep other LOCAL processes out, and nothing here does.
      # See "WHAT LOOPBACK DOES AND DOES NOT BUY" above for the accepted risk and
      # for why enforcement is Milestone 2's rather than a value flipped here.
      BUZZ_REQUIRE_AUTH_TOKEN: "false"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "false"
      BUZZ_GIT_CONFORMANCE_PROBE: "false"
      RUST_LOG: buzz_relay=info,buzz_db=warn,buzz_auth=info,tower_http=warn
    ports:
      # Loopback-only. Never change the left-hand side to 0.0.0.0 or a LAN address:
      # that would breach the loopback invariant this whole PoC rests on.
      - "127.0.0.1:${BUZZ_LOOPBACK_PORT:-3000}:3000"
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp: the runtime image has bash but no curl/wget.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    # Deliberately NOT unless-stopped, unlike the datastores below. This is the one
    # service that accepts connections from the host, so a relay that came back by
    # itself after a reboot would silently resume the local-process exposure above
    # long after the operator finished with the PoC. The datastores keep restarting
    # because they only serve the internal compose network.
    restart: "no"
    networks:
      - buzz-loopback-net

  # No `ports:` on this service or the two below - deliberately unreachable from
  # the host, stricter than the loopback requirement.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_loopback_poc
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzz-loopback-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - buzz-loopback-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buzz_loopback_poc
      MINIO_ROOT_PASSWORD: buzz_loopback_poc_secret
    volumes:
      - buzz-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzz-loopback-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 buzz_loopback_poc buzz_loopback_poc_secret
        mc mb --ignore-existing local/buzz-media
        mc anonymous set none local/buzz-media
      '
    restart: "no"
    networks:
      - buzz-loopback-net

volumes:
  buzz-postgres-data:
  buzz-redis-data:
  buzz-minio-data:
  buzz-git-data:

networks:
  buzz-loopback-net:
    driver: bridge
